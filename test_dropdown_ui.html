<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Morphee AI — Dropdown UI & Diagnostics Test Suite</title>
  <link rel="stylesheet" href="./src/style.css">
  <style>
    body { background: #08090c; color: #e8ecf1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; margin: 0; }
    h1 { color: #4fd1c5; font-size: 20px; margin-bottom: 8px; }
    .summary { font-size: 13px; color: #6b7a8d; margin-bottom: 16px; }
    .test-card { background: #12151b; border: 1px solid #1e2330; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .test-name { font-size: 13px; font-weight: 600; }
    .test-detail { font-size: 11px; color: #6b7a8d; margin-top: 2px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .pass { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
    .fail { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }
    #stats { margin-top: 16px; font-weight: 700; font-size: 14px; color: #4fd1c5; }
    #testSandbox { margin-top: 20px; border: 1px dashed #1e2330; padding: 16px; border-radius: 8px; display: flex; gap: 16px; align-items: center; }
  </style>
</head>
<body>
  <h1>DROPDOWN UI &amp; DIAGNOSTICS TEST SUITE (UI-01 to UI-08)</h1>
  <div class="summary">Validating dark color-scheme tokens, native select options, 5 Max People options, CustomDropdown accessibility, and diagnostic drawer fields.</div>
  <div id="results"></div>
  <div id="stats">Running tests…</div>

  <div id="testSandbox">
    <select id="testSelect" class="styled-select">
      <option value="1">1 Person</option>
      <option value="2">2 People</option>
      <option value="4" selected>4 People</option>
      <option value="6">6 People</option>
      <option value="8">8 People</option>
    </select>
  </div>

  <script type="module">
    import { CustomDropdown } from './src/modules/ui/customDropdown.js';

    const results = [];
    const container = document.getElementById('results');

    function assert(id, name, condition, detail = '') {
      results.push({ id, name, passed: !!condition, detail });
      const card = document.createElement('div');
      card.className = 'test-card';
      card.innerHTML = `
        <div>
          <div class="test-name">${id}: ${name}</div>
          <div class="test-detail">${detail}</div>
        </div>
        <span class="badge ${condition ? 'pass' : 'fail'}">${condition ? 'PASS' : 'FAIL'}</span>
      `;
      container.appendChild(card);
    }

    async function runTests() {
      // ── UI-01: :root has color-scheme: dark ──
      const rootStyle = getComputedStyle(document.documentElement);
      const colorScheme = rootStyle.colorScheme || rootStyle.getPropertyValue('color-scheme');
      assert('UI-01', 'Dark Color Scheme Defined on :root',
        colorScheme.includes('dark'),
        `Root color-scheme computed value: '${colorScheme}'`);

      // ── UI-02: select and .styled-select background is dark ──
      const selectEl = document.getElementById('testSelect');
      const selectStyle = window.getComputedStyle(selectEl);
      const bg = selectStyle.backgroundColor;
      // Convert rgb(18, 21, 27) to brightness
      const match = bg.match(/\d+/g);
      const isDarkBg = match ? (parseInt(match[0]) < 40 && parseInt(match[1]) < 40 && parseInt(match[2]) < 40) : true;
      assert('UI-02', 'Select Control has Dark Background Theme Token',
        isDarkBg,
        `Computed select backgroundColor: ${bg}`);

      // ── UI-03: Max People Options Count (All 5 options: 1, 2, 4, 6, 8) ──
      const optionValues = Array.from(selectEl.options).map(o => o.value);
      const expectedValues = ['1', '2', '4', '6', '8'];
      const hasAll5 = expectedValues.every(v => optionValues.includes(v)) && optionValues.length === 5;
      assert('UI-04', 'Max People Dropdown Preserves All 5 Capacity Options (1, 2, 4, 6, 8)',
        hasAll5,
        `Available options: [${optionValues.join(', ')}]`);

      // ── UI-04: Select Option CSS Rules in Style Sheet ──
      let hasOptionRule = false;
      for (const sheet of document.styleSheets) {
        try {
          for (const rule of sheet.cssRules) {
            if (rule.selectorText && rule.selectorText.includes('option')) {
              hasOptionRule = true;
              break;
            }
          }
        } catch (e) {
          // Cross-origin stylesheet access check
        }
      }
      assert('UI-03', 'Dark Select Option Rules Exist in Stylesheet',
        hasOptionRule,
        'Explicit dark background-color: #12151b and color: #e8ecf1 rules configured in style.css');

      // ── UI-05: CustomDropdown Accessible Combobox Creation ──
      const customInst = new CustomDropdown(selectEl);
      const wrapper = customInst.wrapper;
      const trigger = customInst.trigger;
      const menu = customInst.menu;
      const isAriaValid = wrapper.getAttribute('role') === 'combobox' &&
                          menu.getAttribute('role') === 'listbox' &&
                          trigger.getAttribute('tabindex') === '0';
      assert('UI-05', 'CustomDropdown Component Creates Accessible ARIA Combobox/Listbox',
        isAriaValid && wrapper.classList.contains('custom-dropdown'),
        `Role: '${wrapper.getAttribute('role')}', Listbox: '${menu.getAttribute('role')}'`);

      // ── UI-06: CustomDropdown Keyboard Navigation (ArrowDown & Enter) ──
      customInst.open();
      const openState = wrapper.classList.contains('open');
      // Simulate ArrowDown
      customInst.wrapper.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
      const focusedIdx = customInst.focusedIndex;
      // Simulate Enter
      customInst.wrapper.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      const closedState = !wrapper.classList.contains('open');
      assert('UI-06', 'CustomDropdown Keyboard Navigation (ArrowDown and Enter selection)',
        openState && closedState && customInst.select.selectedIndex === focusedIdx,
        `Opened: ${openState}, Focused index: ${focusedIdx}, Closed on Enter: ${closedState}`);

      // ── UI-07: Two-way Event Synchronization ──
      let eventFired = false;
      selectEl.addEventListener('change', () => { eventFired = true; }, { once: true });
      customInst.selectIndex(3); // Choose "6 People"
      assert('UI-07', 'Two-Way Event Synchronization (Dispatches native change event)',
        eventFired && selectEl.value === '6',
        `Dispatched change event: ${eventFired}, Selected value: '${selectEl.value}'`);

      // ── UI-08: Diagnostics Drawer Rig & Presentation Telemetry ──
      // Fetch index.html text to verify DOM structure
      const resp = await fetch('./index.html');
      const htmlText = await resp.text();
      const hasRigAudit = htmlText.includes('id="dRigAudit"') && htmlText.includes('id="dFingerBones"');
      const hasAutoCategory = htmlText.includes('id="dEstCategory"') && htmlText.includes('id="dCategoryConf"');
      assert('UI-08', 'Diagnostics Drawer Contains Rig & Auto Presentation Telemetry Fields',
        hasRigAudit && hasAutoCategory,
        `Rig fields present: ${hasRigAudit}, Auto category fields present: ${hasAutoCategory}`);

      // ── SUMMARY STATS ──
      const passedCount = results.filter(r => r.passed).length;
      const statsEl = document.getElementById('stats');
      statsEl.textContent = `Completed: ${passedCount} / ${results.length} PASSED (${Math.round(passedCount / results.length * 100)}%)`;
      if (passedCount === results.length) {
        statsEl.style.color = '#2ecc71';
      }
      window.__testResults = { passed: passedCount === results.length, count: results.length, passedCount };
    }

    runTests();
  </script>
</body>
</html>
