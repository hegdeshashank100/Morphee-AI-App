<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Morphee AI — Thumbnail Generator</title>
  <style>
    body { background: #08090c; color: #fff; font-family: sans-serif; padding: 20px; }
    canvas { border: 1px solid #333; margin: 5px; }
    #log { font-family: monospace; white-space: pre-wrap; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Rendering Avatar Previews...</h1>
  <div id="status">Starting...</div>
  <div id="container"></div>
  <div id="log"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { INITIAL_AVATAR_DEFINITIONS } from '/src/modules/library/avatarRegistry.js';

    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const container = document.getElementById('container');

    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
    }

    const width = 256;
    const height = 340;
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    container.appendChild(canvas);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true
    });
    renderer.setSize(width, height, false);
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = null;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff5ea, 1.4);
    keyLight.position.set(1.0, 2.0, 1.5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xddeeff, 0.7);
    fillLight.position.set(-1.0, 1.2, 1.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xa5b4fc, 0.5);
    rimLight.position.set(0, 2.5, -1.5);
    scene.add(rimLight);

    const camera = new THREE.PerspectiveCamera(28, width / height, 0.1, 20);

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    window.__results = {};

    async function processAvatar(def) {
      log(`Loading ${def.id} (${def.name}) from ${def.url}...`);
      return new Promise((resolve) => {
        const timeout = setTimeout(() => {
          log(`Timeout loading ${def.id}`);
          resolve(null);
        }, 15000);

        loader.load(
          def.url,
          (gltf) => {
            clearTimeout(timeout);
            try {
              const vrm = gltf.userData?.vrm;
              if (!vrm) {
                log(`No VRM instance in ${def.id}`);
                resolve(null);
                return;
              }

              try {
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.removeUnnecessaryJoints(gltf.scene);
                VRMUtils.rotateVRM0(vrm);
              } catch (e) {
                console.warn('VRMUtils warning:', e);
              }

              scene.add(vrm.scene);

              // Calculate bust/portrait camera framing
              let headY = 1.40;
              const headBone = vrm.humanoid?.getNormalizedBoneNode('head') || vrm.humanoid?.getRawBoneNode('head');
              if (headBone) {
                vrm.scene.updateMatrixWorld(true);
                const headPos = new THREE.Vector3();
                headBone.getWorldPosition(headPos);
                if (headPos.y > 0.2 && headPos.y < 3.0) {
                  headY = headPos.y;
                }
              } else {
                const bbox = new THREE.Box3().setFromObject(vrm.scene);
                if (!bbox.isEmpty()) {
                  const size = new THREE.Vector3();
                  bbox.getSize(size);
                  headY = bbox.min.y + size.y * 0.85;
                }
              }

              camera.position.set(0, headY - 0.02, 0.84);
              camera.lookAt(0, headY - 0.06, 0);
              camera.updateMatrixWorld();

              renderer.render(scene, camera);

              let dataUrl = canvas.toDataURL('image/webp', 0.92);
              if (!dataUrl || dataUrl.length < 100 || !dataUrl.startsWith('data:image/webp')) {
                dataUrl = canvas.toDataURL('image/png');
              }

              scene.remove(vrm.scene);
              vrm.scene.traverse((obj) => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                  if (Array.isArray(obj.material)) {
                    obj.material.forEach(m => m.dispose());
                  } else {
                    obj.material.dispose();
                  }
                }
              });

              log(`Successfully generated thumbnail for ${def.id} (${Math.round(dataUrl.length / 1024)} KB dataUrl)`);
              resolve(dataUrl);
            } catch (err) {
              log(`Error processing ${def.id}: ${err.message}`);
              resolve(null);
            }
          },
          undefined,
          (err) => {
            clearTimeout(timeout);
            log(`Failed loading ${def.id}: ${err?.message || err}`);
            resolve(null);
          }
        );
      });
    }

    async function run() {
      // Process all definitions
      for (const def of INITIAL_AVATAR_DEFINITIONS) {
        statusEl.textContent = `Processing ${def.name}...`;
        const thumb = await processAvatar(def);
        if (thumb) {
          window.__results[def.id] = thumb;
        }
      }
      statusEl.textContent = `Completed! ${Object.keys(window.__results).length} previews generated.`;
      window.__done = true;
      log(`=== ALL DONE: ${Object.keys(window.__results).length} thumbnails generated ===`);
    }

    run().catch((e) => {
      log('Fatal error: ' + e.message);
      window.__done = true;
    });
  </script>
</body>
</html>
