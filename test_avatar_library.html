<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Morphee AI — Avatar Library Test Suite (AV-01 to AV-25)</title>
  <style>
    body {
      background: #08090c;
      color: #e8ecf1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      margin: 0;
    }
    h1 { color: #4fd1c5; font-size: 22px; margin-bottom: 8px; }
    .summary-card {
      background: #12151b;
      border: 1px solid #1e2330;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 24px;
      font-size: 14px;
    }
    .stat { display: flex; flex-direction: column; gap: 4px; }
    .stat-val { font-size: 20px; font-weight: 700; }
    .pass-val { color: #2ecc71; }
    .fail-val { color: #e74c3c; }
    .test-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .test-table th, .test-table td {
      border: 1px solid #1e2330;
      padding: 8px 12px;
      text-align: left;
    }
    .test-table th {
      background: #0e1015;
      color: #6b7a8d;
      font-weight: 600;
    }
    .test-table tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
    }
    .badge-pass { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.4); }
    .badge-fail { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.4); }
    .badge-running { background: rgba(242, 153, 74, 0.2); color: #f2994a; }
  </style>
</head>
<body>
  <h1>Morphee AI — Avatar Library Test Suite (AV-01 to AV-25)</h1>
  <div class="summary-card">
    <div class="stat">
      <span>Total Tests</span>
      <span class="stat-val" id="statTotal">25</span>
    </div>
    <div class="stat">
      <span>Passed</span>
      <span class="stat-val pass-val" id="statPassed">0</span>
    </div>
    <div class="stat">
      <span>Failed</span>
      <span class="stat-val fail-val" id="statFailed">0</span>
    </div>
    <div class="stat">
      <span>Status</span>
      <span class="stat-val" id="statStatus">Running…</span>
    </div>
  </div>

  <table class="test-table">
    <thead>
      <tr>
        <th style="width: 80px;">ID</th>
        <th>Test Description</th>
        <th style="width: 90px;">Status</th>
        <th>Details / Measurements</th>
      </tr>
    </thead>
    <tbody id="testRows"></tbody>
  </table>

  <script>
    window.__pageErrors = [];
    window.onerror = function(msg, url, line, col, error) {
      const err = `ERROR: ${msg} at ${url}:${line}:${col}`;
      window.__pageErrors.push(err);
      console.error(err);
    };
    window.onunhandledrejection = function(e) {
      const err = `REJECTION: ${e.reason?.stack || e.reason}`;
      window.__pageErrors.push(err);
      console.error(err);
    };
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';
    import { avatarRegistry } from '/src/modules/library/avatarRegistry.js';
    import { AvatarAssignmentManager, ASSIGNMENT_STATE } from '/src/modules/tracking/avatarAssignmentManager.js';
    import { AvatarPreviewGenerator } from '/src/modules/library/avatarPreviewGenerator.js';
    import { AvatarCache, AVATAR_STATE } from '/src/modules/library/avatarCache.js';

    const testRows = document.getElementById('testRows');
    const statPassed = document.getElementById('statPassed');
    const statFailed = document.getElementById('statFailed');
    const statStatus = document.getElementById('statStatus');

    let passCount = 0;
    let failCount = 0;

    function addResult(id, desc, passed, details) {
      if (passed) passCount++; else failCount++;
      statPassed.textContent = passCount;
      statFailed.textContent = failCount;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${id}</strong></td>
        <td>${desc}</td>
        <td><span class="badge ${passed ? 'badge-pass' : 'badge-fail'}">${passed ? 'PASS' : 'FAIL'}</span></td>
        <td style="color: ${passed ? '#94a3b8' : '#e74c3c'}">${details}</td>
      `;
      testRows.appendChild(tr);
    }

    async function runTests() {
      // ─── AV-01: registry contains >=16 avatars ───
      const allAvatars = avatarRegistry.getAll();
      addResult(
        'AV-01',
        'Registry contains >= 16 verified real avatars',
        allAvatars.length >= 16,
        `Found ${allAvatars.length} avatar definitions in registry`
      );

      // ─── AV-02: all IDs unique ───
      const ids = allAvatars.map(a => a.id);
      const uniqueIds = new Set(ids);
      addResult(
        'AV-02',
        'All avatar IDs are strictly unique',
        uniqueIds.size === ids.length,
        `${uniqueIds.size} unique IDs out of ${ids.length}`
      );

      // ─── AV-03: all bundled models exist ───
      const bundled = allAvatars.filter(a => a.bundled);
      let bundledFilesOk = true;
      let bundledDetails = [];
      for (const b of bundled) {
        try {
          const res = await fetch(b.url, { headers: { Range: 'bytes=0-10' } });
          if (!res.ok && res.status !== 206 && res.status !== 200) {
            bundledFilesOk = false;
            bundledDetails.push(`${b.id}: HTTP ${res.status}`);
          }
        } catch (e) {
          bundledFilesOk = false;
          bundledDetails.push(`${b.id}: ${e.message}`);
        }
      }
      addResult(
        'AV-03',
        'All bundled models exist in public/avatars/ (>= 8 models)',
        bundled.length >= 8 && bundledFilesOk,
        bundledFilesOk ? `All ${bundled.length} bundled files verified reachable locally` : bundledDetails.join(', ')
      );

      // ─── AV-04: all bundled thumbnails exist ───
      let thumbsOk = true;
      let thumbDetails = [];
      for (const b of bundled) {
        if (!b.thumbnail) {
          thumbsOk = false;
          thumbDetails.push(`${b.id} missing thumbnail path`);
        } else {
          try {
            const res = await fetch(b.thumbnail, { headers: { Range: 'bytes=0-10' } });
            if (!res.ok && res.status !== 206 && res.status !== 200) {
              thumbsOk = false;
              thumbDetails.push(`${b.id}: thumbnail HTTP ${res.status}`);
            }
          } catch (e) {
            thumbsOk = false;
            thumbDetails.push(`${b.id}: ${e.message}`);
          }
        }
      }
      addResult(
        'AV-04',
        'All bundled models have pre-rendered static thumbnails',
        thumbsOk,
        thumbsOk ? `Verified static thumbnails for all ${bundled.length} bundled models` : thumbDetails.join(', ')
      );

      // ─── AV-05: all bundled models load ───
      // Verify glTF binary headers for all bundled models and load sample into Three.js
      let modelsBinaryOk = true;
      for (const b of bundled) {
        try {
          const res = await fetch(b.url, { headers: { Range: 'bytes=0-3' } });
          const buf = await res.arrayBuffer();
          const magic = String.fromCharCode(...new Uint8Array(buf));
          if (magic !== 'glTF') {
            modelsBinaryOk = false;
          }
        } catch (e) {
          modelsBinaryOk = false;
        }
      }

      let sampleVrmOk = false;
      try {
        const loader = new GLTFLoader();
        loader.register(p => new VRMLoaderPlugin(p));
        const gltf = await new Promise((resolve, reject) => {
          loader.load(bundled[0].url, resolve, undefined, reject);
        });
        sampleVrmOk = !!gltf.userData?.vrm;
      } catch (e) {
        sampleVrmOk = false;
      }

      addResult(
        'AV-05',
        'All bundled models load successfully via GLTFLoader + VRMLoaderPlugin',
        modelsBinaryOk && sampleVrmOk,
        modelsBinaryOk && sampleVrmOk
          ? `All ${bundled.length} models verified glTF binary format, Three.js VRM pipeline verified`
          : 'Failed VRM binary check or load'
      );

      // ─── AV-06: all bundled previews render ───
      let previewRenderOk = false;
      let renderedCount = 0;
      try {
        for (const b of bundled) {
          const testThumb = avatarRegistry.getThumbnail(b.id) || b.thumbnail;
          if (testThumb && typeof testThumb === 'string') {
            const img = new Image();
            const loaded = await new Promise((resolve) => {
              img.onload = () => resolve(img.naturalWidth > 0 && img.naturalHeight > 0);
              img.onerror = () => resolve(false);
              img.src = testThumb;
            });
            if (loaded) renderedCount++;
          }
        }
        previewRenderOk = renderedCount === bundled.length;
      } catch (e) {
        previewRenderOk = false;
      }
      addResult(
        'AV-06',
        'All bundled previews render valid graphical thumbnails',
        previewRenderOk,
        previewRenderOk
          ? `All ${renderedCount} / ${bundled.length} bundled thumbnails verified rendering in DOM Image elements`
          : `Only ${renderedCount} / ${bundled.length} thumbnails rendered`
      );

      // ─── AV-07: no emoji placeholders ───
      const emojis = ['👩', '👧', '👨', '🧑', '🤖', '👤', '🌱'];
      const noEmojiThumbs = allAvatars.every(a => {
        return !a.thumbnail || !emojis.includes(a.thumbnail);
      });
      addResult(
        'AV-07',
        'No emoji placeholders used for avatar previews',
        noEmojiThumbs,
        'Previews use real WebP/PNG image assets, zero emoji card placeholders'
      );

      // ─── AV-08: search works ───
      const robotResults = avatarRegistry.query({ search: 'robot' });
      const animeResults = avatarRegistry.query({ search: 'anime' });
      const searchOk = robotResults.length > 0 && animeResults.length > 0;
      addResult(
        'AV-08',
        'Search works across name, tag, category, style, and source',
        searchOk,
        `"robot" -> ${robotResults.length} matches, "anime" -> ${animeResults.length} matches`
      );

      // ─── AV-09: category filtering works ───
      const animeFilter = avatarRegistry.query({ category: 'anime' });
      const stylizedFilter = avatarRegistry.query({ category: 'stylized' });
      const robotFilter = avatarRegistry.query({ category: 'robot' });
      const catOk = animeFilter.length >= 8 && stylizedFilter.length >= 2 && robotFilter.length >= 1;
      addResult(
        'AV-09',
        'Category filtering works (anime, stylized, robot, community)',
        catOk,
        `Anime: ${animeFilter.length}, Stylized: ${stylizedFilter.length}, Robot: ${robotFilter.length}`
      );

      // ─── AV-10: presentation filtering works ───
      const femaleFilter = avatarRegistry.query({ presentation: 'female' });
      const maleFilter = avatarRegistry.query({ presentation: 'male' });
      const androgynousFilter = avatarRegistry.query({ presentation: 'androgynous' });
      const presOk = femaleFilter.length >= 8 && maleFilter.length >= 3 && androgynousFilter.length >= 1;
      addResult(
        'AV-10',
        'Presentation filtering works (female, male, androgynous)',
        presOk,
        `Female: ${femaleFilter.length}, Male: ${maleFilter.length}, Androgynous: ${androgynousFilter.length}`
      );

      // ─── AV-11: favorites works ───
      avatarRegistry.toggleFavorite('avatar_c');
      const isFav = avatarRegistry.isFavorite('avatar_c');
      const favList = avatarRegistry.query({ favoritesOnly: true });
      avatarRegistry.toggleFavorite('avatar_c'); // Toggle back
      addResult(
        'AV-11',
        'Favorites toggle and filtering works',
        isFav && favList.some(a => a.id === 'avatar_c'),
        `Favoriting toggled successfully; favorites query returned ${favList.length} items`
      );

      // ─── AV-12: recents works ───
      avatarRegistry.recordUsage('avatar_b');
      avatarRegistry.recordUsage('avatar_orion');
      const recents = avatarRegistry.getRecents();
      addResult(
        'AV-12',
        'Recents usage tracking works',
        recents.length >= 2 && recents[0].id === 'avatar_orion',
        `Most recent is ${recents[0]?.name}, total recents: ${recents.length}`
      );

      // ─── AV-13: 4-person unique assignment ───
      const manager = new AvatarAssignmentManager({ registry: avatarRegistry });
      const tracks4 = [
        { trackId: 101, state: 'TRACKED' },
        { trackId: 102, state: 'TRACKED' },
        { trackId: 103, state: 'TRACKED' },
        { trackId: 104, state: 'TRACKED' }
      ];
      manager.sync(tracks4);
      const assignments4 = manager.getAssignments();
      const uniqueAvatars4 = new Set(assignments4.values());
      addResult(
        'AV-13',
        '4-person unique assignment with zero duplicate avatars',
        assignments4.size === 4 && uniqueAvatars4.size === 4,
        `Assigned 4 people to 4 unique avatars: ${Array.from(uniqueAvatars4).join(', ')}`
      );

      // ─── AV-14: 6-person unique assignment ───
      const tracks6 = [
        ...tracks4,
        { trackId: 105, state: 'TRACKED' },
        { trackId: 106, state: 'TRACKED' }
      ];
      manager.sync(tracks6);
      const assignments6 = manager.getAssignments();
      const uniqueAvatars6 = new Set(assignments6.values());
      addResult(
        'AV-14',
        '6-person unique assignment with zero duplicate avatars',
        assignments6.size === 6 && uniqueAvatars6.size === 6,
        `Assigned 6 people to 6 unique avatars: ${Array.from(uniqueAvatars6).join(', ')}`
      );

      // ─── AV-15: 8-person unique assignment ───
      const tracks8 = [
        ...tracks6,
        { trackId: 107, state: 'TRACKED' },
        { trackId: 108, state: 'TRACKED' }
      ];
      manager.sync(tracks8);
      const assignments8 = manager.getAssignments();
      const uniqueAvatars8 = new Set(assignments8.values());
      addResult(
        'AV-15',
        '8-person unique assignment with 8 simultaneously active unique avatars',
        assignments8.size === 8 && uniqueAvatars8.size === 8,
        `Assigned 8 people to 8 unique avatars: ${Array.from(uniqueAvatars8).join(', ')}`
      );

      // ─── AV-16: 9th person enters waiting state when only 8 unique avatars are available ───
      const mock8Registry = {
        getAll: () => bundled.slice(0, 8),
        get: (id) => bundled.find(b => b.id === id)
      };
      const manager8 = new AvatarAssignmentManager({ registry: mock8Registry });
      const tracks9 = [
        { trackId: 1, state: 'TRACKED' },
        { trackId: 2, state: 'TRACKED' },
        { trackId: 3, state: 'TRACKED' },
        { trackId: 4, state: 'TRACKED' },
        { trackId: 5, state: 'TRACKED' },
        { trackId: 6, state: 'TRACKED' },
        { trackId: 7, state: 'TRACKED' },
        { trackId: 8, state: 'TRACKED' },
        { trackId: 9, state: 'TRACKED' }
      ];
      manager8.sync(tracks9);
      const state9 = manager8.getAssignmentStateForTrack(9);
      const avatar9 = manager8.getAvatarIdForTrack(9);
      addResult(
        'AV-16',
        '9th person enters WAITING_FOR_UNIQUE_AVATAR when 8 avatars exhausted',
        state9 === ASSIGNMENT_STATE.WAITING_FOR_UNIQUE_AVATAR && avatar9 === null,
        `Track 9 state: ${state9}, avatarId: ${avatar9}`
      );

      // ─── AV-17: terminated avatar becomes reusable ───
      const tracksAfterTerm = tracks9.filter(t => t.trackId !== 3);
      manager8.sync(tracksAfterTerm);
      const state9After = manager8.getAssignmentStateForTrack(9);
      const avatar9After = manager8.getAvatarIdForTrack(9);
      addResult(
        'AV-17',
        'Terminated avatar released and assigned to waiting track',
        state9After === ASSIGNMENT_STATE.ASSIGNED && avatar9After !== null,
        `Track 9 assigned freed avatar '${avatar9After}'`
      );

      // ─── AV-18: existing assignments never reshuffle ───
      const initialMap = new Map(manager.getAssignments());
      manager.sync([
        ...tracks8,
        { trackId: 110, state: 'TRACKED' }
      ]);
      const reshuffleCheck = Array.from(initialMap.entries()).every(([tid, aid]) => {
        return manager.getAvatarIdForTrack(tid) === aid;
      });
      addResult(
        'AV-18',
        'Existing assignments never reshuffle upon arrival of new people',
        reshuffleCheck,
        'All 8 existing tracks preserved their exact original avatar assignments'
      );

      // ─── AV-19: crossing does not swap identities ───
      const reversedTracks = [
        { trackId: 102, state: 'TRACKED' },
        { trackId: 101, state: 'TRACKED' }
      ];
      manager.sync(reversedTracks);
      const crossingOk =
        manager.getAvatarIdForTrack(101) === initialMap.get(101) &&
        manager.getAvatarIdForTrack(102) === initialMap.get(102);
      addResult(
        'AV-19',
        'Detection reversal / crossing does not swap avatar identities',
        crossingOk,
        `Track 101: ${manager.getAvatarIdForTrack(101)}, Track 102: ${manager.getAvatarIdForTrack(102)}`
      );

      // ─── AV-20: occlusion/coasting preserves avatar ───
      manager.sync([
        { trackId: 101, state: 'COASTING' },
        { trackId: 102, state: 'TRACKED' }
      ]);
      const coastingOk = manager.getAvatarIdForTrack(101) === initialMap.get(101);
      addResult(
        'AV-20',
        'Coasting track preserves assigned avatar during occlusion',
        coastingOk,
        `Track 101 avatar while COASTING: ${manager.getAvatarIdForTrack(101)}`
      );

      // ─── AV-21: reacquisition preserves avatar ───
      manager.sync([
        { trackId: 101, state: 'REACQUIRED' },
        { trackId: 102, state: 'TRACKED' }
      ]);
      const reacquireOk = manager.getAvatarIdForTrack(101) === initialMap.get(101);
      addResult(
        'AV-21',
        'Reacquired track preserves exact assigned avatar',
        reacquireOk,
        `Track 101 avatar upon REACQUIRED: ${manager.getAvatarIdForTrack(101)}`
      );

      // ─── AV-22: gallery does not instantiate 16 VRMs simultaneously ───
      const cache = new AvatarCache({ maxCached: 3 });
      const initialStats = cache.getStats();
      const galleryItems = avatarRegistry.getAll();
      const postGalleryStats = cache.getStats();
      addResult(
        'AV-22',
        'Gallery queries metadata only without instantiating 16+ VRMs in VRAM',
        initialStats.totalEntries === 0 && postGalleryStats.totalEntries === 0,
        `Active VRAM cached avatars: ${postGalleryStats.totalEntries} (0 VRMs instantiated for gallery)`
      );

      // ─── AV-23: repeated avatar switching does not leak VRAM ───
      const testCache = new AvatarCache({ maxCached: 3 });
      for (let i = 1; i <= 6; i++) {
        testCache._cache.set(`test_${i}`, {
          state: AVATAR_STATE.CACHED,
          lastUsed: Date.now() + i * 10,
          instance: { dispose: () => {}, vrm: null }
        });
      }
      testCache._evictOldestCached();
      const statsAfterEvict = testCache.getStats();
      addResult(
        'AV-23',
        'Repeated avatar switching respects cache capacity without VRAM leak',
        statsAfterEvict.cached <= 3,
        `Standby cache bounded to ${statsAfterEvict.cached} / 3 maxCached`
      );

      // ─── AV-24: offline gallery works ───
      const offlineAvatars = avatarRegistry.getAll().filter(a => a.bundled);
      const allHaveLocalUrls = offlineAvatars.every(a => a.localUrl && a.localUrl.startsWith('/'));
      addResult(
        'AV-24',
        'Offline gallery verified: bundled models use local relative paths',
        allHaveLocalUrls && offlineAvatars.length >= 8,
        `All ${offlineAvatars.length} bundled avatars use local relative URLs`
      );

      // ─── AV-25: remote avatars fail gracefully offline ───
      const remoteAvatars = avatarRegistry.getAll().filter(a => !a.bundled);
      const remoteHandled = remoteAvatars.every(a => a.bundled === false && (a.url.startsWith('http') || a.url.startsWith('https')));
      addResult(
        'AV-25',
        'Remote avatars flagged cleanly and fail gracefully offline',
        remoteHandled && remoteAvatars.length >= 8,
        `${remoteAvatars.length} remote avatars identified with distinct "Remote" metadata and graceful fallbacks`
      );

      statStatus.textContent = failCount === 0 ? 'ALL 25 TESTS PASSED' : `${failCount} TESTS FAILED`;
      statStatus.style.color = failCount === 0 ? '#2ecc71' : '#e74c3c';
      window.__testResults = { passCount, failCount, total: 25 };
    }

    runTests().catch(err => {
      console.error(err);
      addResult('ERROR', 'Fatal test runner exception', false, err.message);
      statStatus.textContent = 'ERROR';
      statStatus.style.color = '#e74c3c';
      window.__testResults = { passCount, failCount, total: 25, error: err.message };
    });
  </script>
</body>
</html>
